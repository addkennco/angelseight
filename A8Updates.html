<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Updates Incoming</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Monoton&family=Nova+Square&family=Carattere&family=Noto+Emoji&display=swap');

  :root {
    --bg:      #061005;
    --bg2:     #0D1C18;
    --green:   #1CC74C;
    --light:   #acfa70;
    --dark:    #147c1b;
    --dim:     #1CC74C22;
    --mono:    'Nova Square', monospace;
    --display: 'Monoton', sans-serif;
    --cursive: 'Carattere', cursive;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }

  html, body {
    width:100%; height:100%;
    background: var(--bg);
    color: var(--green);
    font-family: var(--mono);
    overflow: hidden;
    touch-action: none;
  }

  /* Scanline overlay */
  body::after {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
  }

  /* ── Slide system ── */
  #cover-wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 1;
    pointer-events: all;
  }

  /* Slide 0 */
  #slide-0 {
    background: radial-gradient(ellipse at 50% 30%, #011a01 0%, #021002 70%);
  }

  /* ── Title cover ── */
  .cover-eyebrow {
    font-size: 9px; letter-spacing: 0.45em;
    color: var(--green); opacity: 0.65; margin-bottom: 14px;
  }
  .cover-title-wrap {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
  }
  .cover-title {
    font-family: var(--display);
    font-size: clamp(30px, 10vw, 64px);
    font-weight: 900; line-height: 0.9; letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--light) 0%, var(--dark) 50%, var(--green) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 30px rgba(28,199,76,0.4));
    padding: 12px 16px; margin-bottom: 0; text-align: center;
  }
  .cover-cursive {
    font-family: var(--cursive);
    font-size: clamp(30px, 7vw, 56px);
    color: var(--green);
    text-shadow: 0 0 20px rgba(28,199,76,0.7), 0 0 50px rgba(0,0,0,0.4);
    line-height: 1; position: absolute; z-index: 2;
    pointer-events: none; white-space: nowrap;
  }
  .cover-intro {
    font-size: 12px; line-height: 1.8;
    color: rgba(28,199,76,0.7);
    text-align: left; max-width: 300px; margin-bottom: 32px;
  }

  /* ── Ship canvas ── */
  #ship-canvas {
    display: block;
    position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
  }

  /* ── Ship flicker  ── */
  @keyframes shipFlicker {
    0%   { opacity: 1; }
    3%   { opacity: 0.2; }
    5%   { opacity: 1; }
    47%  { opacity: 1; }
    48%  { opacity: 0.5; }
    49%  { opacity: 1; }
    72%  { opacity: 1; }
    73%  { opacity: 0.1; }
    74%  { opacity: 0.9; }
    75%  { opacity: 0.3; }
    76%  { opacity: 1; }
    100% { opacity: 1; }
  }
  #ship-canvas {
    animation: shipFlicker 4.3s ease-in-out infinite;
  }
</style>
</head>
<body>

<div id="cover-wrap">
  <div class="slide" id="slide-0">
    <div class="cover-eyebrow">PARDON OUR SPACE DUST</div>
    <div class="cover-title-wrap">
      <div class="cover-title"><br>EIGHT</div>
      <div class="cover-cursive">Angel's</div>
    </div>
    <div class="cover-intro">
      Updates Incoming<br>
      6 New Boss Geometries for NG+<br>
      Music & Waveform Background Interaction<br>
      NG+ 8th run surprise!<br>
	  Stay tuned, space cadets!
    </div>
    <canvas id="ship-canvas"></canvas>
  </div>
</div>

<!-- Scan bar overlay -->
<canvas id="scan-overlay" style="position:fixed;inset:0;pointer-events:none;z-index:998;"></canvas>

<script>
  // ── Ship canvas ──
  const canvas = document.getElementById('ship-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resizeShipCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const maxW = Math.min(window.innerWidth, 430);
    const intro = document.querySelector('.cover-intro');
    const introRect = intro.getBoundingClientRect();
    const remaining = window.innerHeight - introRect.bottom;
    const canvasH = Math.max(remaining, 60);

    canvas.style.width  = maxW + 'px';
    canvas.style.height = canvasH + 'px';
    canvas.style.marginLeft = '0px';
    canvas.width  = maxW * dpr;
    canvas.height = canvasH * dpr;
    W = maxW; H = canvasH;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
  }

  // ── Waveform background ──
  let t = 0;
  const pal = { grid:'#64e15e', sun:'#1cc74c' };

  function hexToRgb(hex) {
    return { r:parseInt(hex.slice(1,3),16), g:parseInt(hex.slice(3,5),16), b:parseInt(hex.slice(5,7),16) };
  }

  function drawWaves() {
    const rows = 18;
    const rowSpan = H / rows;
    const sideW = W * 0.30;
    const c1 = hexToRgb(pal.grid);
    const c2 = hexToRgb(pal.sun);
    for (let r = 0; r < rows; r++) {
      const baseY = (r * rowSpan + rowSpan * 0.5) % H;
      const screenPct = baseY / H;
      const amp  = (4.8 + screenPct * rows * 1.4) * (0.4 + screenPct * 0.6);
      const freq = 0.022 + screenPct * rows * 0.001;
      const ph   = t * 0.5 + screenPct * rows * 0.3;
      const ph2  = t * 0.3 + screenPct * rows * 0.18;
      const rr = Math.round(c1.r + (c2.r - c1.r) * screenPct);
      const gg = Math.round(c1.g + (c2.g - c1.g) * screenPct);
      const bb = Math.round(c1.b + (c2.b - c1.b) * screenPct);
      const alpha = 0.12 + screenPct * 0.30;
      ctx.strokeStyle = `rgba(${rr},${gg},${bb},${alpha})`;
      ctx.lineWidth = 0.85;
      ctx.beginPath();
      for (let px = 0; px <= W; px += 2) {
        let blend;
        if (px <= sideW) {
          const tt = 1 - px / sideW;
          blend = 0.5 - 0.5 * Math.cos(tt * Math.PI);
        } else if (px >= W - sideW) {
          const tt = (px - (W - sideW)) / sideW;
          blend = 0.5 - 0.5 * Math.cos(tt * Math.PI);
        } else { blend = 0; }
        const wave = Math.sin(px * freq + ph) * amp
                   + Math.sin(px * freq * 2.1 + ph2) * amp * 0.4
                   + Math.sin(px * freq * 0.5 + ph * 0.7) * amp * 0.2;
        const py = baseY - wave * blend;
        px === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }

  // ── Ship ──
  function drawShip(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = '#1cc74c'; ctx.shadowBlur = 16;

    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-12, 8);
    ctx.lineTo(-5, 4);
    ctx.lineTo(0, 10);
    ctx.lineTo(5, 4);
    ctx.lineTo(12, 8);
    ctx.closePath();
    ctx.strokeStyle = '#1cc74c'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-12, 8); ctx.lineTo(-18, 2); ctx.lineTo(-10, -2);
    ctx.strokeStyle = '#1cc74c'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(12, 8); ctx.lineTo(18, 2); ctx.lineTo(10, -2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 10, 3, 0, Math.PI*2);
    ctx.fillStyle = '#1cc74c'; ctx.fill();

    ctx.restore();
  }

  let lastTime = 0;
  function animate(ts) {
    const dt = (ts - lastTime) / 1000;
    lastTime = ts;
    t += dt;

    resizeShipCanvas();

    ctx.fillStyle = '#061005';
    ctx.fillRect(0, 0, W, H);
    drawWaves();

    // Gentle drift
    const cx = W / 2 + Math.sin(t * 0.4) * 18;
    const cy = H / 2 + Math.sin(t * 0.27) * 8;
    drawShip(cx, cy);

    requestAnimationFrame(animate);
  }

  // ── Scan bar overlay ──
  (function() {
    const sc = document.getElementById('scan-overlay');
    const sctx = sc.getContext('2d');
    let startTime = null;
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      sc.width  = window.innerWidth  * dpr;
      sc.height = window.innerHeight * dpr;
      sc.style.width  = window.innerWidth  + 'px';
      sc.style.height = window.innerHeight + 'px';
      sctx.setTransform(1,0,0,1,0,0);
      sctx.scale(dpr, dpr);
    }
    resize();
    window.addEventListener('resize', resize);
    function renderScan(ts) {
      if (!startTime) startTime = ts;
      const elapsed = (ts - startTime) / 1000;
      const W2 = window.innerWidth, H2 = window.innerHeight;
      sctx.clearRect(0, 0, W2, H2);
      const barY = ((elapsed * 0.4) % 1) * H2;
      const grad = sctx.createLinearGradient(0, barY - 40, 0, barY + 40);
      grad.addColorStop(0,    'rgba(28,199,76,0)');
      grad.addColorStop(0.45, 'rgba(28,199,76,0.04)');
      grad.addColorStop(0.5,  'rgba(172,250,112,0.10)');
      grad.addColorStop(0.55, 'rgba(28,199,76,0.04)');
      grad.addColorStop(1,    'rgba(28,199,76,0)');
      sctx.fillStyle = grad;
      sctx.fillRect(0, barY - 40, W2, 80);
      requestAnimationFrame(renderScan);
    }
    requestAnimationFrame(renderScan);
  })();

  document.fonts.ready.then(() => {
    resizeShipCanvas();
    requestAnimationFrame(animate);
  });
</script>
</body>
</html>
